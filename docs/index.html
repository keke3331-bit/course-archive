<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講座アーカイブ</title>
  <meta name="description" content="過去に開催した講座の動画と資料をいつでも見返せるアーカイブ。">
  <meta property="og:title" content="講座アーカイブ">
  <meta property="og:description" content="過去に開催した講座の動画と資料を、いつでも見返せるアーカイブです。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-icon" aria-hidden="true">📚</span>
        <span class="logo-text">講座アーカイブ</span>
      </a>
      <nav class="site-nav">
        <a href="#featured-section">最新</a>
        <a href="#courses">アーカイブ</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ヒーロー -->
    <section class="hero hero-editorial">
      <div class="hero-decor" aria-hidden="true"></div>
      <div class="container hero-inner">
        <p class="hero-eyebrow">LECTURE ARCHIVE</p>
        <h1 class="hero-title">
          過去の学びを、<br>
          もう一度。
        </h1>
        <p class="hero-sub">
          これまでに開催した講座の動画と手元資料を、<br class="br-pc">いつでも見返せるアーカイブです。
        </p>
        <a href="#courses" class="hero-cta">
          講座を探す
          <span class="hero-cta-arrow" aria-hidden="true">↓</span>
        </a>
      </div>
    </section>

    <!-- FEATURED：最新講座 -->
    <section id="featured-section" class="featured-section" hidden>
      <div class="container">
        <header class="section-header">
          <p class="section-eyebrow">FEATURED</p>
          <h2 class="section-title">最新の講座</h2>
        </header>
        <div id="featured-slot"><!-- JSで描画 --></div>
      </div>
    </section>

    <!-- ARCHIVES：一覧 -->
    <section id="courses" class="archives-section">
      <div class="container">
        <header class="section-header">
          <p class="section-eyebrow">ARCHIVES</p>
          <h2 class="section-title">すべての講座</h2>
        </header>

        <div class="filter-bar">
          <input type="search" id="search-input" class="search-input" placeholder="🔍 キーワード検索（タイトル・講師名・タグ）">
          <div class="tag-filter" id="tag-filter" aria-label="タグで絞り込み"></div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>

        <div class="courses-grid" id="courses-grid">
          <!-- JSで描画 -->
        </div>

        <p class="empty-state" id="empty-state" hidden>該当する講座が見つかりませんでした。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year"></span> 講座アーカイブ</p>
    </div>
  </footer>

  <script src="data/courses.js?v=8"></script>
  <script src="js/main.js?v=8"></script>
</body>
</html>
