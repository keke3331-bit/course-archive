<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART LIFE MC | 講座アーカイブ</title>
  <meta name="description" content="北総校 鎌ヶ谷キャンパス｜講座アーカイブと次回のサークル活動スケジュール。">
  <meta property="og:title" content="SMART LIFE MC | 講座アーカイブ">
  <meta property="og:description" content="過去の講座と次回のサークル活動を、いつでも見返せるアーカイブです。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css?v=9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-logo">
        <span class="logo-icon" aria-hidden="true">📚</span>
        <span class="logo-text">講座アーカイブ</span>
      </a>
      <nav class="site-nav">
        <a href="#schedule">次回の活動</a>
        <a href="#featured-section">最新</a>
        <a href="#courses">アーカイブ</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ヒーロー：バナー全文表示 -->
    <section class="hero hero-banner">
      <div class="container hero-inner">
        <p class="hero-eyebrow">SMART LIFE MEMBERS CLUB / LECTURE ARCHIVE</p>
        <figure class="hero-banner-figure">
          <img src="assets/images/banner.jpg" alt="SMART LIFE MC — Club Vision: デジタル化する社会における格差を解消する / Club Mission: 全てのお宅にデジタル担当を / Purpose: 当クラブの普及継続で社会に貢献する / Club Action: デジタルライフプランナーがいるくらしの普及" loading="eager">
        </figure>
        <div class="hero-meta">
          <h1 class="hero-title">過去の学びを、もう一度。</h1>
          <p class="hero-sub">これまでに開催した講座の動画と資料、次回のサークル活動をまとめてご覧いただけます。</p>
          <div class="hero-actions">
            <a href="#schedule" class="btn-pill btn-pill-primary">次回の活動を見る</a>
            <a href="#courses" class="btn-pill btn-pill-ghost">アーカイブを探す</a>
          </div>
        </div>
      </div>
    </section>

    <!-- 次回のサークル活動 -->
    <section id="schedule" class="schedule-section">
      <div class="container">
        <header class="section-header">
          <p class="section-eyebrow">UPCOMING ACTIVITIES</p>
          <h2 class="section-title"><span id="schedule-month-label">6月</span>のサークル活動</h2>
          <p class="section-sub" id="schedule-campus">北総校 鎌ヶ谷キャンパス</p>
        </header>

        <div class="schedule-notice" id="schedule-notice">
          <!-- JS -->
        </div>

        <ol class="schedule-list" id="schedule-list">
          <!-- JS -->
        </ol>

        <div class="schedule-footnote" id="schedule-footnote">
          <!-- JS -->
        </div>
      </div>
    </section>

    <!-- FEATURED：最新講座 -->
    <section id="featured-section" class="featured-section" hidden>
      <div class="container">
        <header class="section-header">
          <p class="section-eyebrow">FEATURED</p>
          <h2 class="section-title">最新の講座</h2>
        </header>
        <div id="featured-slot"></div>
      </div>
    </section>

    <!-- ARCHIVES：一覧 -->
    <section id="courses" class="archives-section">
      <div class="container">
        <header class="section-header">
          <p class="section-eyebrow">ARCHIVES</p>
          <h2 class="section-title">すべての講座</h2>
        </header>

        <div class="filter-bar">
          <input type="search" id="search-input" class="search-input" placeholder="🔍 キーワード検索（タイトル・講師名・タグ）">
          <div class="tag-filter" id="tag-filter" aria-label="タグで絞り込み"></div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>

        <div class="courses-grid" id="courses-grid"></div>
        <p class="empty-state" id="empty-state" hidden>該当する講座が見つかりませんでした。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year"></span> SMART LIFE MC ・ 講座アーカイブ</p>
    </div>
  </footer>

  <script src="data/courses.js?v=9"></script>
  <script src="data/schedule.js?v=9"></script>
  <script src="js/main.js?v=9"></script>
</body>
</html>
